[metadata]
name = opulent-mcp-gateway
version = 0.1.0

[options]
packages = find:
install_requires =
    fastapi>=0.110.0
    uvicorn[standard]>=0.27.0
    pydantic>=2.5.0
    sqlalchemy[asyncio]>=2.0.0
    asyncpg>=0.29.0
    httpx>=0.25.0
    python-jsonrpc-server>=0.4.0
    python-dotenv>=1.0.0
python_requires = >=3.9

[options.extras_require]
test =
    pytest>=7.4.0
    pytest-asyncio>=0.21.0

[options.packages.find]
include = gateway*
